function matches(c,r){const v=String(c[r.field]??'').toLowerCase(),q=r.value.toLowerCase();return r.op==='is'?v===q:r.op==='not'?v!==q:r.op==='contains'?v.includes(q):r.op==='after'?v>=q:v<=q}
function selectedItems(f){let a=feedItems().filter(c=>(!f.sources.length||f.sources.some(s=>c.source.includes(s)))&&(!f.rules.length||(f.match==='any'?f.rules.some(r=>matches(c,r)):f.rules.every(r=>matches(c,r)))));return a.sort((a,b)=>{for(const s of f.sorts){let v=String(a[s.field]??'').localeCompare(String(b[s.field]??''));if(v)return s.dir==='desc'?-v:v}return a.id-b.id})}

const fields=[['type','Item type'],['created','Created date'],['priority','Priority · custom'],['status','Status · custom'],['title','Title'],['source','Source']];
const opts=(list,value)=>list.map(([v,l])=>`<option value="${v}" ${v===value?'selected':''}>${l}</option>`).join('');
function editFeed(id){draft=JSON.parse(JSON.stringify(feeds.find(f=>f.id===id)||{id:'feed-'+Date.now(),name:'',icon:'layers',pinned:false,rules:[],sorts:[],sources:[],match:'all'}));drawEditor()}
function drawEditor(){modal(draft.name?'Edit feed':'A new perspective',`<form id="feed-definition"><label class="form-field"><span>Feed name</span><input id="feed-name" maxlength="40" value="${esc(draft.name)}" placeholder="Weekend possibilities" required></label><div class="editor-section"><div class="between"><h3>Sources</h3><span class="small muted">Combine sources</span></div><p class="small muted">All items by default. Choose sources to narrow the pool.</p><div class="source-chips">${['SMS','Email','Notomu','reading list','weekend','Creative life'].map(s=>`<label><input type="checkbox" data-feed-source="${s}" ${draft.sources.includes(s)?'checked':''}>${s}</label>`).join('')}</div></div><div class="editor-section"><div class="between"><h3>Filters</h3><label class="small">Match <select id="feed-match"><option value="all" ${draft.match!=='any'?'selected':''}>all</option><option value="any" ${draft.match==='any'?'selected':''}>any</option></select> rules</label></div>${draft.rules.map((r,i)=>`<div class="rule-row"><select aria-label="Filter ${i+1} property" data-rule="${i}" data-key="field">${opts(fields,r.field)}</select><select aria-label="Filter ${i+1} operator" data-rule="${i}" data-key="op">${opts([['is','is'],['not','is not'],['contains','contains'],['after','on / after'],['before','on / before']],r.op)}</select><input aria-label="Filter ${i+1} value" data-rule="${i}" data-key="value" type="${r.field==='created'?'date':'text'}" list="feed-values" value="${esc(r.value)}" placeholder="Value" required><button type="button" data-remove-rule="${i}" aria-label="Remove filter ${i+1}">×</button></div>`).join('')}<datalist id="feed-values">${['Message','Article','Note','Event','Task','High','Normal','Idea','Open','Done'].map(v=>`<option value="${v}">`).join('')}</datalist><button type="button" class="text-btn" data-add-rule>${icon('plus')}Add filter</button></div><div class="editor-section"><h3>Grouping</h3><label class="form-field"><span>Group items by</span><select id="feed-group">${opts([['','No grouping'],['type','Item type'],['created','Created date'],['source','Source'],['priority','Priority · custom'],['status','Status · custom']],draft.groupBy||'')}</select></label><label class="form-field"><span>Group order</span><select id="feed-group-order">${opts([['asc','Ascending'],['desc','Descending']],draft.groupOrder||'asc')}</select></label><p class="small muted">Group headers stay below the feed title as you scroll. Sort rules apply within each group.</p></div><div class="editor-section"><h3>Sort order</h3><p class="small muted">Applied from top to bottom.</p>${draft.sorts.map((r,i)=>`<div class="rule-row sort-row"><span class="muted small">${i+1}</span><select aria-label="Sort ${i+1} property" data-sort="${i}" data-key="field">${opts(fields,r.field)}</select><select aria-label="Sort ${i+1} direction" data-sort="${i}" data-key="dir">${opts([['asc','Ascending'],['desc','Descending']],r.dir)}</select><button type="button" data-remove-sort="${i}" aria-label="Remove sort ${i+1}">×</button></div>`).join('')}<button type="button" class="text-btn" data-add-sort>${icon('plus')}Add sort level</button></div><div class="dialog-footer"><span class="small muted">${selectedItems(draft).length} matching sample items</span><button type="button" class="btn" data-action="closeModal">Cancel</button><button class="btn dark" type="submit">Save feed</button></div><p class="notice">Feed definitions are saved in this browser. No accounts are connected.</p></form>`)}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.openFeed)selectFeed(d.openFeed);if('feedNew'in d)editFeed();if('feedEdit'in d)editFeed(activeFeed);if('manageDock'in d)manageDock();if('addRule'in d){draft.rules.push({field:'type',op:'is',value:'Note'});drawEditor()}if('addSort'in d){draft.sorts.push({field:'created',dir:'desc'});drawEditor()}if('removeRule'in d){draft.rules.splice(+d.removeRule,1);drawEditor()}if('removeSort'in d){draft.sorts.splice(+d.removeSort,1);drawEditor()}if(d.moveFeed){const i=feeds.findIndex(f=>f.id===d.moveFeed),j=i+Number(d.direction);if(j>=0&&j<feeds.length){[feeds[i],feeds[j]]=[feeds[j],feeds[i]];persistFeeds();nav();manageDock()}}});

 return '<div class="messaging-intro between"><p>One person. Every conversation.</p><span class="pill">Fictional messages · no live accounts</span></div><div class="messaging-controls"><div class="message-view-tabs" role="group" aria-label="Conversation attention view">'+[['attention','All attention'],['unread','Unread'],['response','Needs response'],['all','All conversations']].map(([key,name])=>'<button data-message-view="'+key+'" aria-pressed="'+(state.messageView===key)+'" class="'+(state.messageView===key?'active':'')+'">'+name+(key==='unread'?' <span>'+unread+'</span>':key==='response'?' <span>'+needs+'</span>':'')+'</button>').join('')+'</div><div class="messaging-source-filters"><select id="message-channel-filter" aria-label="Filter by channel">'+opts([['All','All channels'],['Email','Email'],['SMS','SMS']],state.messageChannel)+'</select><select id="message-account-filter" aria-label="Filter by account">'+opts([['All','All accounts'],['Personal email','Personal email'],['Mobile SMS','Mobile SMS']],state.messageAccount)+'</select></div></div><div class="messaging-layout '+(state.messagePerson?'has-conversation':'')+'"><aside class="messaging-conversations" aria-label="People conversations">'+messagingList()+'</aside><section class="messaging-thread" aria-label="Unified contact timeline">'+messagingTimeline()+'</section></div>';
}
const contextBeforeMessaging=pageContext;
pageContext=function(){return state.page==='messaging'?{title:'Messaging',icon:icon('message'),kind:'experience'}:contextBeforeMessaging()};
const renderBeforeMessaging=render;
render=function(){
 renderBeforeMessaging();document.body.classList.toggle('messaging-mode',state.page==='messaging');
 if(state.page==='messaging'){
  document.body.classList.add('experience-mode');
  const history=$('#messaging-history'),list=$('.messaging-conversations');
  if(history){history.scrollTop=state.messageTimelineScroll||0;history.addEventListener('scroll',()=>state.messageTimelineScroll=history.scrollTop,{passive:true})}
  if(list){list.scrollTop=state.messageListScroll||0;list.addEventListener('scroll',()=>state.messageListScroll=list.scrollTop,{passive:true})}
 }
};
const settingsBeforeMessaging=settingsPage;
settingsPage=function(){return settingsBeforeMessaging().replace('<div class="eyebrow">Item types</div>','<button data-settings-section="experience:messaging" class="'+(state.settingsSection==='experience:messaging'?'active':'')+'">'+icon('message')+'<span>Messaging</span></button><div class="eyebrow">Item types</div>')};
const sectionBeforeMessaging=sectionMarkup;
sectionMarkup=function(){
 if(state.settingsSection!=='experience:messaging')return sectionBeforeMessaging();
 const pref=experiencePreferences.messaging||{};
 return '<h2 class="settings-section-title">Messaging</h2><p class="small muted">A unified contact timeline over your Person and Message items.</p><label class="form-field"><span>Default view</span><select id="messaging-default-view">'+opts([['attention','All attention'],['unread','Unread'],['response','Needs response'],['all','All conversations']],pref.view||'attention')+'</select></label><label class="form-field"><span>Default delivery channel</span><select id="messaging-default-channel">'+opts([['SMS','SMS'],['Email','Email']],pref.channel||'SMS')+'</select></label><h3>Sample accounts</h3><div class="messaging-account-row">'+icon('mail')+'<div><strong>Personal email</strong><small>me@example.com · preview only</small></div><span class="pill">Not connected</span></div><div class="messaging-account-row">'+icon('message')+'<div><strong>Mobile SMS</strong><small>+1 303-555-0100 · preview only</small></div><span class="pill">Not connected</span></div><p class="notice">No live inbox, provider delivery, attachment downloads, or read-state synchronization. Preview actions affect only local sample items. Unread is separate from Seen and from Needs response.</p>';
};
const mobileTitleBeforeMessaging=mobileSectionTitle;
mobileSectionTitle=function(){return state.settingsSection==='experience:messaging'?'Messaging':mobileTitleBeforeMessaging()};
const entryBeforeMessaging=homeEntry;
homeEntry=function(key,name,sub,svg){
 if(key==='exp:messaging'){const all=models.filter(m=>m.type==='Message'&&m.relatedPerson);sub=all.filter(m=>m.messageUnread).length+' unread · '+all.filter(messageNeeds).length+' need response'}
 return entryBeforeMessaging(key,name,sub,svg);
};
function openMessagingPerson(uid){
 if(!messagePeople().some(p=>p.uid===uid))return;
 if(state.page==='messaging'&&state.messagePerson!==uid){locationStack.push(pendingLocation||rememberLocation());pendingLocation=null}
 state.messagePerson=uid;state.messageTimelineScroll=0;
 if(state.page!=='messaging')go('messaging');else render();
}
const itemBeforeMessagingLink=itemPage;
itemPage=function(){
 const html=itemBeforeMessagingLink(),c=currentItem();if(c?.type!=='Person')return html;
 const root=document.createElement('div');root.innerHTML=html;root.querySelector('#item-title')?.insertAdjacentHTML('afterend','<button class="btn person-messaging-link" data-message-open-person="'+c.uid+'">'+icon('message')+'Open unified timeline</button>');return root.innerHTML;
};
document.addEventListener('input',e=>{
 if(e.target.id==='message-person-search'){state.messageSearch=e.target.value;$('#message-conversation-list').outerHTML=(()=>{const root=document.createElement('div');root.innerHTML=messagingList();return root.querySelector('#message-conversation-list').outerHTML})();return}
 const key=e.target.id==='message-compose-body'?'body':e.target.id==='message-compose-subject'?'subject':'';
 if(key&&state.messagePerson){messageDraft(state.messagePerson)[key]=e.target.value;saveMessageDrafts();const status=$('.composer-draft-state');if(status)status.textContent='Draft saved on this device'}
});
document.addEventListener('change',e=>{
 const d=e.target.dataset;
 if(e.target.id==='message-channel-filter'){state.messageChannel=e.target.value;state.messageTimelineScroll=0;render()}
 if(e.target.id==='message-account-filter'){state.messageAccount=e.target.value;state.messageTimelineScroll=0;render()}
 if(e.target.id==='message-compose-channel'){messageDraft(state.messagePerson).channel=e.target.value;saveMessageDrafts();render()}
 if(d.messageResponse){const m=models.find(m=>m.uid===d.messageResponse);if(m){m.messageResponse=e.target.value;saveModels();render()}}
 if(e.target.id==='messaging-default-view'||e.target.id==='messaging-default-channel'){
  const key=e.target.id.endsWith('view')?'view':'channel';experiencePreferences.messaging={...experiencePreferences.messaging,[key]:e.target.value};localStorage.setItem('notomu-experience-settings',JSON.stringify(experiencePreferences));
 }
});
document.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;const d=button.dataset;
 if(d.messagePerson)openMessagingPerson(d.messagePerson);
 if(d.messageOpenPerson)openMessagingPerson(d.messageOpenPerson);
 if('messageList'in d){state.messagePerson='';render()}
 if(d.messageView){state.messageView=d.messageView;render()}
 if(d.messageRead){const m=models.find(m=>m.uid===d.messageRead);if(m){m.messageUnread=!m.messageUnread;saveModels();render()}}
 if(d.messageReply){const m=models.find(m=>m.uid===d.messageReply);if(m){
  const draft=messageDraft(m.relatedPerson);draft.replyTo=m.uid;draft.channel=m.channel||'SMS';if(!draft.subject)draft.subject=/^Re:/i.test(m.title)?m.title:'Re: '+m.title;saveMessageDrafts();render();$('#message-compose-body')?.focus();
 }}
 if('messageClearReply'in d){messageDraft(state.messagePerson).replyTo='';saveMessageDrafts();render()}
 if(d.messageTask){const m=models.find(m=>m.uid===d.messageTask);if(m){capture('Task');newDraft.title='Follow up: '+m.title;newDraft.relatedPerson=m.relatedPerson;newDraft.relatedMessage=m.uid;newDraft.body='Follow up on this '+(m.channel||'')+' message:\n\n'+m.body;render()}}
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='messaging-compose')return;e.preventDefault();
 const person=messagePeople().find(p=>p.uid===state.messagePerson),draft=messageDraft(state.messagePerson);if(!person||!draft.body.trim()){toast('Write a message first.');return}
 const now=new Date().toISOString(),reply=models.find(m=>m.uid===draft.replyTo);
 const uid='message-preview-'+Date.now();
 models.push({uid,type:'Message',icon:'message',title:draft.channel==='Email'?(draft.subject||'New email'):'Message to '+person.title,body:draft.body.trim(),relatedPerson:person.uid,person:person.title,channel:draft.channel,messageDirection:'Outgoing',messageUnread:false,messageResponse:'Handled',messageAt:now,messageAccount:draft.channel==='Email'?'Personal email':'Mobile SMS',messageThread:reply?.channel===draft.channel?reply.messageThread:'preview-thread-'+uid,messageParticipants:draft.channel==='Email'?person.personEmail:person.personPhone,messageReplyTo:reply?.uid||'',messageDelivery:'Demo sent',messageAttachments:[],source:'Messaging preview',labels:['Communication'],seen:true,created:now.slice(0,10),modified:now,time:'Just now'});
 if(reply)reply.messageResponse='Handled';
 messageDrafts[person.uid]={channel:draft.channel,body:'',subject:'',replyTo:''};saveMessageDrafts();saveModels();state.messageTimelineScroll=999999;render();toast('Preview added to the timeline. Nothing was sent.');
});


// Item Properties Menu: a per-type split between the page and its supporting fields.
paths.panelRight='<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16M18 8h1M18 12h1M18 16h1"/>';
paths.moveToPage='<path d="M20 5v14M4 12h11m-5-5 5 5-5 5"/>';
const itemPropertiesQuery=window.matchMedia('(max-width:800px)');
state.itemPropertiesDesktopOpen=localStorage.getItem('notomu-item-properties-open')!=='false';
state.itemPropertiesMobileOpen=false;
navigationKeys.push('itemPropertiesDesktopOpen','itemPropertiesMobileOpen');
function defaultPropertySurface(type,p){
 if(['type','title','labels'].includes(p.key)||['long_text','related','media_player'].includes(p.kind))return 'page';
 if(type==='Task'&&['status','date'].includes(p.key))return 'page';
 if(type==='Event'&&['date','location'].includes(p.key))return 'page';
 return 'menu';
}
function propertySurface(type,p){
 if(['type','title'].includes(p.key))return 'page';
 return typePreferences[type]?.propertySurfaces?.[p.key]||defaultPropertySurface(type,p);
}
function setPropertySurface(type,key,surface){
 const p=definitions(type).find(p=>p.key===key);if(!p||['type','title'].includes(key))return;
 typePreferences[type]={...typePreferences[type],propertySurfaces:{...typePreferences[type]?.propertySurfaces,[key]:surface}};
 localStorage.setItem('notomu-type-settings',JSON.stringify(typePreferences));
}
function propertiesMenuOpen(){return itemPropertiesQuery.matches?state.itemPropertiesMobileOpen:state.itemPropertiesDesktopOpen}
function propertyMenuGroup(p){
 if(['seen','source','created','modified'].includes(p.key))return 'Record';
 if(p.key==='labels')return 'Organization';
 if(['long_text','related','media_player'].includes(p.kind))return 'Content';
 if(p.kind==='reference')return 'Connections';
 if(['file','url'].includes(p.kind))return 'Files & links';
 return 'Details';
}
function propertySurfaceElement(type,p,node,surface){
 const shell=document.createElement('div');shell.className='property-surface-element '+(surface==='menu'?'menu-property-surface':'main-property-surface');shell.dataset.propertySurface=surface;shell.dataset.propertyKey=p.key;
 shell.append(node);
 if(!['type','title'].includes(p.key)){
  const button=document.createElement('button');button.type='button';button.className='property-surface-move';
  button.dataset.movePropertySurface=p.key;button.dataset.propertySurfaceTo=surface==='menu'?'page':'menu';
  const destination=surface==='menu'?'main page':'Item Properties Menu';
  button.setAttribute('aria-label','Move '+p.name+' to '+destination);button.title='Move '+p.name+' to '+destination;
  button.innerHTML=icon(surface==='menu'?'arrow':'panelRight');shell.append(button);
 }
 return shell;
}
const pageBeforePropertiesMenu=itemPage;
itemPage=function(){
 const html=pageBeforePropertiesMenu(),c=currentItem();if(!c)return html;
 const root=document.createElement('div');root.innerHTML=html;const article=root.querySelector('.document-item');if(!article)return html;
 const defs=definitions(c.type),layout=layoutForType(c.type).filter(x=>x.visible||(newDraft&&['title','type'].includes(x.key)));
 const nodes=new Map();
 defs.forEach(p=>{const node=p.key==='title'?article.querySelector('#item-title'):Array.from(article.querySelectorAll('[data-stack-element]')).find(el=>el.dataset.stackElement===p.key);if(node)nodes.set(p.key,node)});
 const extras=Array.from(article.children).filter(el=>!el.dataset.stackElement&&el.id!=='item-title'&&!el.classList.contains('media-metadata-section'));
 const main=document.createElement('article');main.className='document-item item-primary-content';main.setAttribute('aria-label','Item page');
 const groups=new Map();let insertedExtras=false;
 layout.forEach(entry=>{
  const p=defs.find(p=>p.key===entry.key),node=nodes.get(entry.key);if(!p||!node)return;
  const surface=propertySurface(c.type,p),shell=propertySurfaceElement(c.type,p,node,surface);
  if(surface==='page'){
   main.append(shell);
   if(p.key==='labels'){extras.forEach(el=>main.append(el));insertedExtras=true}
  }else{
   const name=propertyMenuGroup(p);if(!groups.has(name))groups.set(name,[]);groups.get(name).push(shell);
  }
 });
 if(!insertedExtras)extras.forEach(el=>main.append(el));
 const aside=document.createElement('aside');aside.id='item-properties-menu';aside.className='item-properties-menu';aside.setAttribute('aria-label','Item Properties Menu');
 const mobile=itemPropertiesQuery.matches,open=propertiesMenuOpen();
 if(mobile&&open){aside.setAttribute('role','dialog');aside.setAttribute('aria-modal','true')}
 if(!open){aside.hidden=true;aside.setAttribute('inert','')}
 aside.innerHTML='<div class="item-properties-menu-head"><div><h2 tabindex="-1">Item Properties Menu</h2><p>'+esc(typeName(c.type))+' details</p></div><button class="icon-btn item-properties-close" data-close-item-properties aria-label="Close Item Properties Menu">'+icon('close')+'</button></div>';
 if(groups.size){
  ['Details','Files & links','Connections','Organization','Content','Record'].forEach(name=>{
   if(!groups.has(name))return;const section=document.createElement('section');section.className='item-property-group';
   const heading=document.createElement('h3');heading.textContent=name;section.append(heading);groups.get(name).forEach(node=>section.append(node));aside.append(section);
  });
 }else aside.insertAdjacentHTML('beforeend','<p class="item-properties-empty">All visible properties are on the main page. Move properties here from the page or item-type settings.</p>');
 aside.insertAdjacentHTML('beforeend','<p class="item-properties-footnote">Move fields between this menu and the page. Placement applies to every '+esc(typeName(c.type).toLowerCase())+'.</p>');
 const split=document.createElement('div');split.className='item-record-layout '+(open?'properties-open':'properties-closed');split.append(main,aside);article.replaceWith(split);
 if(mobile&&open)split.insertAdjacentHTML('beforeend','<button class="item-properties-backdrop" data-close-item-properties aria-label="Dismiss Item Properties Menu" tabindex="-1"></button>');
 return root.innerHTML;
};
const drawBeforePropertiesMenu=drawTypeLayout;
drawTypeLayout=function(){
 drawBeforePropertiesMenu();const panel=$('#settings-panel'),type=activeSchemaType();if(!panel)return;
 const intro=panel.querySelector('.type-layout-settings>p');if(intro)intro.textContent='Choose what appears on the main page and in the Item Properties Menu. Order and visibility apply to every '+typeName(type).toLowerCase()+'.';
 const title=panel.querySelector('.type-layout-settings>h3');if(title)title.textContent='Item page & Properties Menu';
 panel.querySelectorAll('.schema-stack-entry').forEach(entry=>{
  const key=entry.querySelector('[data-layout-visible]')?.dataset.layoutVisible,p=definitions(type).find(p=>p.key===key);if(!p)return;
  const fixed=['type','title'].includes(key),label=document.createElement('label');label.className='property-surface-setting';
  label.innerHTML='<span>Show in</span><select data-property-surface-setting="'+key+'" aria-label="Placement for '+esc(p.name)+'" '+(fixed?'disabled':'')+'>'+opts([['page','Main item page'],['menu','Item Properties Menu']],propertySurface(type,p))+'</select>'+(fixed?'<small>Page anchor</small>':'');
  entry.querySelector('.layout-stack-row').after(label);
 });
};
const renderBeforePropertiesMenu=render;
render=function(){
 renderBeforePropertiesMenu();const viewing=state.page==='item';document.body.classList.toggle('item-properties-mode',viewing);
 document.body.classList.toggle('item-properties-mobile-open',viewing&&itemPropertiesQuery.matches&&state.itemPropertiesMobileOpen);
 if(!viewing)return;
 const header=$('#main .unified-header');if(header){
  header.insertAdjacentHTML('beforeend','<button class="icon-btn item-properties-toggle '+(propertiesMenuOpen()?'active':'')+'" data-item-properties-toggle aria-label="Item Properties Menu" title="Item Properties Menu" aria-controls="item-properties-menu" aria-expanded="'+propertiesMenuOpen()+'">'+icon('panelRight')+'</button>');
 }
};
function toggleItemProperties(open){
 if(itemPropertiesQuery.matches)state.itemPropertiesMobileOpen=open;
 else{state.itemPropertiesDesktopOpen=open;localStorage.setItem('notomu-item-properties-open',String(open))}
 const y=window.scrollY;render();window.scrollTo(0,y);
 if(itemPropertiesQuery.matches&&open)$('#item-properties-menu h2')?.focus({preventScroll:true});else $('[data-item-properties-toggle]')?.focus({preventScroll:true});
}
const goBeforePropertiesMenu=go;
go=function(page){if(page==='item'&&!restoringLocation)state.itemPropertiesMobileOpen=false;goBeforePropertiesMenu(page)};
document.addEventListener('click',e=>{
 const button=e.target.closest('button');if(!button)return;const d=button.dataset;
 if('itemPropertiesToggle'in d)toggleItemProperties(!propertiesMenuOpen());
 if('closeItemProperties'in d)toggleItemProperties(false);
 if(d.movePropertySurface&&state.page==='item'){
  const c=currentItem(),p=definitions(c.type).find(p=>p.key===d.movePropertySurface),y=window.scrollY,scroll=$('#item-properties-menu')?.scrollTop||0;
  setPropertySurface(c.type,p.key,d.propertySurfaceTo);render();window.scrollTo(0,y);if($('#item-properties-menu'))$('#item-properties-menu').scrollTop=scroll;
  toast(p.name+' moved to '+(d.propertySurfaceTo==='page'?'the main page':'Item Properties Menu')+' for '+typeName(c.type,true)+'.');
 }
});
document.addEventListener('change',e=>{
 const key=e.target.dataset.propertySurfaceSetting;if(!key)return;
 setPropertySurface(activeSchemaType(),key,e.target.value);drawTypeLayout();
});
document.addEventListener('keydown',e=>{
 if(state.page!=='item'||!itemPropertiesQuery.matches||!state.itemPropertiesMobileOpen)return;
 if(e.key==='Escape'){e.preventDefault();toggleItemProperties(false);return}
 if(e.key==='Tab'){
  const panel=$('#item-properties-menu'),focusable=Array.from(panel.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex="0"]')).filter(el=>el.getClientRects().length);
  if(!focusable.length)return;
  const first=focusable[0],last=focusable.at(-1);
  if(e.shiftKey&&(document.activeElement===first||document.activeElement===panel.querySelector('h2'))){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
 }
});
itemPropertiesQuery.addEventListener('change',()=>{state.itemPropertiesMobileOpen=false;if(state.page==='item')render()});

render();syncDrawer();
</script></body></html>
