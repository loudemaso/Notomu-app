// Unified item pages and property-based cards.
const itemTypesV2=['Note','Task','Event','Article','Message'];
const propertyNames={labels:'Labels',status:'Status',priority:'Priority',source:'Source',created:'Created',date:'Date',location:'Location',url:'URL',channel:'Channel',person:'Person'};
const modelKey='notomu-item-pages-v2';
let lastCreatedType='Note',selectedUid='',itemReturn='today',newDraft=null,appPrefs={compact:false};
let models=feedItems().map((c,i)=>({...c,uid:'sample-'+i,labels:[...(itemLabels[c.title]||[])],date:'',location:'',url:'',channel:c.type==='Message'?(c.source.includes('SMS')?'SMS':'Email'):'',person:c.type==='Message'?c.source.split(' · ')[0]:''}));
try{const saved=JSON.parse(localStorage.getItem(modelKey));if(saved){if(Array.isArray(saved.items)&&saved.items.every(i=>i.uid&&itemTypesV2.includes(i.type)))models=saved.items;if(itemTypesV2.includes(saved.lastType))lastCreatedType=saved.lastType;if(saved.prefs)appPrefs=saved.prefs}}catch{}
function saveModels(){try{localStorage.setItem(modelKey,JSON.stringify({items:models,lastType:lastCreatedType,prefs:appPrefs}))}catch{toast('Changes kept for this session.')}}
feedItems=function(){return models.map(c=>({...c,labels:c.labels||[],status:c.task?(state.tasks.find(t=>t.id===c.task)?.done?'Done':c.status):c.status}))};
function cog(){return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 2-.6 2.7-1.5.9-2.7-.8-2.5 4.4 2.1 1.9v1.8l-2.1 1.9 2.5 4.4 2.7-.8 1.5.9.6 2.7h5l.6-2.7 1.5-.9 2.7.8 2.5-4.4-2.1-1.9v-1.8l2.1-1.9-2.5-4.4-2.7.8-1.5-.9-.6-2.7Z"/><circle cx="12" cy="12" r="3.2"/></svg>'}

const previousHomeScreen=homeScreen;
homeScreen=function(){return previousHomeScreen().replace('<span class="eyebrow">Your space</span>','<button class="icon-btn" data-app-settings aria-label="App settings">'+cog()+'</button>')};
function displayProp(c,k){if(k==='labels')return (c.labels||[]).join(' · ')||'No labels';return String(c[k]||'Empty')}
function cardProperties(c,f){const visible=f.cardProperties===undefined?['labels','status']:f.cardProperties;return visible.map(k=>'<span class="card-property"><span>'+esc(propertyNames[k]||k)+'</span><strong>'+esc(displayProp(c,k))+'</strong></span>').join('')}
home=function(){const f=feeds.find(f=>f.id===activeFeed),cards=selectedItems(f);return '<header class="stream-header between"><h1 class="feed-header-title">'+esc(f.name)+'</h1><button class="icon-btn feed-settings" data-feed-edit aria-label="Feed settings">'+cog()+'</button></header>'+cards.map(c=>'<article class="stream-card item-card" role="button" tabindex="0" data-open-item="'+esc(c.uid)+'" aria-label="Open '+esc(c.title)+'"><div class="stream-meta"><span class="type-icon">'+icon(c.icon)+'</span><span>'+esc(c.type)+'</span><time>'+esc(c.time||c.created)+'</time></div>'+(c.art?'<div class="stream-art" aria-hidden="true"></div>':'')+'<h2>'+esc(c.title)+'</h2><p>'+esc(c.body)+'</p>'+(f.cardProperties?.length===0?'':'<div class="card-properties">'+cardProperties(c,f)+'</div>')+'</article>').join('')+(cards.length?'<div class="stream-end">You’re all caught up.</div>':'<div class="empty-state">No items match this feed yet.</div>')};
const originalEditorV2=drawEditor;
drawEditor=function(){originalEditorV2();const footer=$('#feed-definition .dialog-footer');footer.insertAdjacentHTML('beforebegin','<section class="editor-section"><h3>Card properties</h3><p class="small muted">Choose what appears beneath the divider on each card.</p><div class="property-choices">'+Object.entries(propertyNames).map(([key,name])=>'<label><input type="checkbox" data-card-property="'+key+'" '+((draft.cardProperties===undefined?['labels','status']:draft.cardProperties).includes(key)?'checked':'')+'>'+name+'</label>').join('')+'</div></section>')};
function resolveNewType(){if(state.page==='today'){const f=feeds.find(f=>f.id===activeFeed);const possible=itemTypesV2.filter(type=>{const tests=f.rules.map(r=>r.field==='type'?matches({type},r):true);return !tests.length|| (f.match==='any'?tests.some(Boolean):tests.every(Boolean))});if(possible.length===1)return possible[0]}return lastCreatedType}
function typeIconV2(type){return {Note:'note',Task:'check',Event:'calendar',Article:'book',Message:'message'}[type]}
function openUnified(uid){if(!models.some(c=>c.uid===uid))return;itemReturn=state.page==='item'?itemReturn:state.page;selectedUid=uid;newDraft=null;if($('#modal').open)closeModal();dockSearchOpen=false;dockSearchRoot.hidden=true;go('item')}
capture=function(type){itemReturn=state.page==='item'?itemReturn:state.page;const kind=itemTypesV2.includes(type)?type:resolveNewType();newDraft={uid:'item-'+Date.now(),type:kind,icon:typeIconV2(kind),title:'',body:'',labels:[],source:'Notomu',created:new Date().toISOString().slice(0,10),time:'Just now',status:kind==='Event'?'Idea':'Open',priority:'Normal',date:'',location:'',url:'',channel:kind==='Message'?'Email':'',person:''};selectedUid=newDraft.uid;if($('#modal').open)closeModal();dockSearchOpen=false;dockSearchRoot.hidden=true;go('item');$('#item-title').focus()};
function currentItem(){return newDraft||models.find(c=>c.uid===selectedUid)}
function relevantProperties(c){return ['labels','status','priority','source','created',...(c.type==='Event'?['date','location']:c.type==='Task'?['date']:c.type==='Article'?['url']:c.type==='Message'?['channel','person']:[])]}
function itemPage(){const c=currentItem();if(!c)return '<div class="empty-state">Item not found.</div>';return '<div class="item-page-nav"><button class="text-btn" data-item-back>← Back</button><span class="small muted">'+(newDraft?'New item':'Saved in this browser')+'</span>'+(newDraft?'<button class="btn dark" data-create-item>Create item</button>':'')+'</div><article class="document-item"><div class="item-type-line">'+icon(c.icon)+(newDraft?'<select id="item-type" aria-label="Item type">'+itemTypesV2.map(t=>'<option '+(t===c.type?'selected':'')+'>'+t+'</option>').join('')+'</select>':'<span>'+esc(c.type)+'</span>')+'</div><textarea id="item-title" aria-label="Item title" rows="2" placeholder="Untitled">'+esc(c.title)+'</textarea><div class="item-properties">'+relevantProperties(c).map(k=>'<div class="item-property-row"><label for="prop-'+k+'">'+propertyNames[k]+'</label><div>'+(k==='labels'?'<div class="inline-labels">'+(c.labels||[]).map(l=>'<span class="inline-label">'+esc(l)+'<button data-remove-inline-label="'+esc(l)+'" aria-label="Remove label '+esc(l)+'">×</button></span>').join('')+'<input id="prop-labels" aria-label="Add label" list="known-labels" placeholder="Add a label…"><button class="inline-add-label" data-add-inline-label aria-label="Add label">+</button><datalist id="known-labels">'+[...new Set([...labelNames,...models.flatMap(i=>i.labels||[])])].map(l=>'<option value="'+esc(l)+'">').join('')+'</datalist></div>':k==='status'||k==='priority'||k==='channel'?'<select id="prop-'+k+'" data-item-prop="'+k+'">'+(k==='priority'?['Normal','High','Low']:k==='channel'?['Email','SMS']:c.type==='Event'?['Idea','Interested','Planned','Not interested']:['Open','In progress','Done']).map(v=>'<option '+(v===c[k]?'selected':'')+'>'+v+'</option>').join('')+'</select>':'<input id="prop-'+k+'" data-item-prop="'+k+'" '+(k==='created'?'readonly ':'')+'type="'+(['created','date'].includes(k)?'date':k==='url'?'url':'text')+'" value="'+esc(c[k]||'')+'" placeholder="Empty">')+'</div></div>').join('')+'</div><textarea class="item-body-editor" id="item-body" aria-label="Item body" placeholder="Start writing…">'+esc(c.body)+'</textarea></article>'}
function updateCurrent(){const c=currentItem();if(!c)return;if(c.task){const t=state.tasks.find(t=>t.id===c.task);if(t){t.title=c.title;t.done=c.status==='Done'}}itemLabels[c.title]=c.labels||[];if(!newDraft)saveModels()}
function addInlineLabel(){const input=$('#prop-labels'),value=input.value.trim();if(!value)return;const c=currentItem();if(!c.labels.includes(value))c.labels.push(value);if(!labelNames.includes(value))labelNames.push(value);updateCurrent();render()}
function saveNewItem(){const c=currentItem();c.title=c.title.trim();if(!c.title){$('#item-title').focus();toast('Give your item a title.');return}if(c.type==='Task'){c.task=Date.now();state.tasks.push({id:c.task,title:c.title,project:'Personal',time:'Today',done:c.status==='Done'})}models.unshift({...c,labels:[...c.labels]});lastCreatedType=c.type;selectedUid=c.uid;newDraft=null;saveModels();render();toast('Item created.')}
function settingsMenu(){modal('App settings','<div class="settings-section"><h3>Appearance</h3><label class="filter-option"><input type="checkbox" id="compact-cards" '+(appPrefs.compact?'checked':'')+'>Compact item cards</label></div><div class="settings-section"><h3>Creation</h3><p class="small muted">New uses a feed’s single item type when its filters determine one. Otherwise, it remembers the last type you created.</p><p class="small">Last created type: <strong>'+esc(lastCreatedType)+'</strong></p></div><div class="settings-section"><h3>About this workspace</h3><p class="small muted">Interactive mockup with fictional data. Items and preferences stay in this browser. No services are connected.</p></div><div class="dialog-footer"><button class="btn dark" data-action="closeModal">Done</button></div>')}
const renderBeforeDocuments=render;
render=function(){renderBeforeDocuments();document.body.classList.toggle('item-page-mode',state.page==='item');document.body.classList.toggle('compact-cards',!!appPrefs.compact)};
dockResults=function(q){const query=q.trim().toLowerCase();const result=feedItems().filter(c=>!query||(c.title+' '+c.body+' '+c.type+' '+c.source+' '+(c.labels||[]).join(' ')).toLowerCase().includes(query)).slice(0,8);dockSearchRoot.hidden=false;dockSearchRoot.innerHTML='<div class="dock-results-heading">'+(query?'Results':'Explore your items')+'<span>'+result.length+' shown</span></div>'+result.map(c=>'<button class="dock-result" data-open-item="'+c.uid+'">'+icon(c.icon)+'<span><strong>'+esc(c.title)+'</strong><small>'+esc(c.type)+' · '+esc(c.source)+'</small></span>'+icon('arrow')+'</button>').join('')+(result.length?'':'<div class="empty-state">No matching items.</div>')};
// Route all item entry points through the document view, before legacy demo handlers.
document.addEventListener('click',e=>{const el=e.target.closest('[data-open-item],button');if(!el)return;const d=el.dataset;
 if(d.openItem){e.preventDefault();e.stopImmediatePropagation();openUnified(d.openItem);return}
 if(d.item||d.demoItem||d.event||d.itemLabels!==undefined){let title=d.itemLabels;if(d.item)title=state.items.find(i=>i.id===+d.item)?.title;if(d.demoItem)title=demoCards.find(i=>i.id===+d.demoItem)?.title;if(d.event)title=state.events.find(i=>i.id===+d.event)?.title;let model=models.find(c=>c.title===title);if(!model&&d.event){const v=state.events.find(i=>i.id===+d.event);model={uid:'event-'+v.id,type:'Event',icon:'calendar',title:v.title,body:v.place,source:'Calendar',status:v.status[0].toUpperCase()+v.status.slice(1),priority:'Normal',created:new Date().toISOString().slice(0,10),labels:[],date:'',location:v.place};models.push(model)}if(model){e.preventDefault();e.stopImmediatePropagation();openUnified(model.uid);return}}
 if('appSettings'in d){settingsMenu();return}if('itemBack'in d){newDraft=null;go(itemReturn==='item'?'today':itemReturn);return}if('createItem'in d){saveNewItem();return}if('addInlineLabel'in d){addInlineLabel();return}if(d.removeInlineLabel!==undefined){currentItem().labels=currentItem().labels.filter(l=>l!==d.removeInlineLabel);updateCurrent();render();return}
},true);
document.addEventListener('keydown',e=>{if(e.target.matches('.item-card')&&['Enter',' '].includes(e.key)){e.preventDefault();openUnified(e.target.dataset.openItem)}if(e.target.id==='prop-labels'&&e.key==='Enter'){e.preventDefault();addInlineLabel()}});
document.addEventListener('input',e=>{if(e.target.id==='item-title'){currentItem().title=e.target.value;updateCurrent()}if(e.target.id==='item-body'){currentItem().body=e.target.value;updateCurrent()}});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.itemProp){currentItem()[d.itemProp]=e.target.value;updateCurrent()}if(e.target.id==='item-type'&&newDraft){newDraft.type=e.target.value;newDraft.icon=typeIconV2(newDraft.type);newDraft.status=newDraft.type==='Event'?'Idea':'Open';render()}if(d.cardProperty){if(draft.cardProperties===undefined)draft.cardProperties=['labels','status'];draft.cardProperties=e.target.checked?[...new Set([...draft.cardProperties,d.cardProperty])]:draft.cardProperties.filter(p=>p!==d.cardProperty)}if(e.target.id==='compact-cards'){appPrefs.compact=e.target.checked;saveModels();document.body.classList.toggle('compact-cards',appPrefs.compact)}});

const locationStack=[];let pendingLocation=null,restoringLocation=false;
const navigationKeys=['page','feed','query','libraryFilter','taskFilter','contact','inboxFilter','channel','week','showIdeas','discoveryQuery'];
function rememberLocation(){const view={};navigationKeys.forEach(k=>view[k]=state[k]);return {view,activeFeed,selectedUid,itemReturn,newDraft:newDraft?JSON.parse(JSON.stringify(newDraft)):null,scroll:window.scrollY,search:dockSearchOpen,searchText:$('#dock-search-input')?.value||'',focus:document.activeElement?.id||'',selection:document.activeElement?.selectionStart}}
document.addEventListener('pointerdown',()=>{pendingLocation=rememberLocation()},true);
document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key))pendingLocation=rememberLocation()},true);
const goBeforeHistory=go;
go=function(page){if(!restoringLocation){const previous=pendingLocation||rememberLocation();if(previous.view.page!==page||page==='item'||page==='today')locationStack.push(previous)}pendingLocation=null;goBeforeHistory(page)};
function returnToLocation(){if(!locationStack.length)return;const previous=locationStack.pop();restoringLocation=true;Object.assign(state,previous.view);activeFeed=previous.activeFeed;selectedUid=previous.selectedUid;itemReturn=previous.itemReturn;newDraft=previous.newDraft;dockSearchOpen=previous.search;if($('#modal').open)closeModal();render();if(previous.search){$('#dock-search-input').value=previous.searchText;dockResults(previous.searchText)}else dockSearchRoot.hidden=true;requestAnimationFrame(()=>{window.scrollTo(0,previous.scroll);if(previous.focus){const el=document.getElementById(previous.focus);if(el){el.focus({preventScroll:true});if(typeof previous.selection==='number'&&el.setSelectionRange)el.setSelectionRange(previous.selection,previous.selection)}}});restoringLocation=false;pendingLocation=null}
function pageContext(){if(state.page==='home')return {title:'Home',icon:homeSymbol(),kind:'app'};if(state.page==='today'){const f=feeds.find(f=>f.id===activeFeed);return {title:f.name,icon:feedPageIcon(),kind:'feed'}}if(state.page==='item'){const c=currentItem();return {title:c?.type||'Item',icon:icon(c?.icon||'note'),kind:'type'}}const map={tasks:['Tasks','check'],calendar:['Calendar','calendar'],studio:['Creative studio','grid'],community:['Community','globe'],inbox:['Inbox','message'],library:['Items','layers']},p=map[state.page]||['Notomu','layers'];return {title:p[0],icon:icon(p[1]),kind:'experience'}}
let typePreferences={},experiencePreferences={};try{typePreferences=JSON.parse(localStorage.getItem('notomu-type-settings')||'{}');experiencePreferences=JSON.parse(localStorage.getItem('notomu-experience-settings')||'{}')}catch{}
function contextSettings(){const p=pageContext();if(p.kind==='app'){settingsMenu();return}if(p.kind==='feed'){editFeed(activeFeed);return}if(p.kind==='type'){const type=currentItem().type;modal(type+' settings','<p class="small muted">Defaults for new '+esc(type.toLowerCase())+' items.</p><label class="form-field"><span>Default priority</span><select id="type-default-priority">'+['Normal','High','Low'].map(v=>'<option '+((typePreferences[type]?.priority||'Normal')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><div class="dialog-footer"><button class="btn dark" data-action="closeModal">Done</button></div>');return}const pref=experiencePreferences[state.page]||{};modal(p.title+' settings',state.page==='calendar'?'<label class="filter-option"><input id="experience-ideas" type="checkbox" '+(state.showIdeas?'checked':'')+'>Show event possibilities</label>':state.page==='tasks'?'<label class="form-field"><span>Task view</span><select id="experience-task-view"><option '+(state.taskFilter==='Today'?'selected':'')+'>Today</option><option '+(state.taskFilter==='All'?'selected':'')+'>All</option></select></label>':'<label class="filter-option"><input id="experience-compact" type="checkbox" '+(pref.compact?'checked':'')+'>Compact layout</label>');$('#modal .dialog-body').insertAdjacentHTML('beforeend','<div class="dialog-footer"><button class="btn dark" data-action="closeModal">Done</button></div>')}
const captureBeforeTypeDefaults=capture;capture=function(type){captureBeforeTypeDefaults(type);if(newDraft&&typePreferences[newDraft.type]?.priority){newDraft.priority=typePreferences[newDraft.type].priority;render()}};
const renderBeforeConsistentHeader=render;
render=function(){renderBeforeConsistentHeader();const main=$('#main'),p=pageContext();main.querySelectorAll('.stream-header,.home-screen-header,.experience-header').forEach(el=>el.remove());const oldNav=main.querySelector('.item-page-nav');if(oldNav){const create=oldNav.querySelector('[data-create-item]');if(create){const actions=document.createElement('div');actions.className='item-create-actions';actions.appendChild(create);oldNav.before(actions)}oldNav.remove()}const title=main.querySelector('.home-screen-intro');if(title)title.remove();const pageHead=main.querySelector('.page-head');if(pageHead){pageHead.querySelector('.page-title')?.remove();pageHead.querySelector('.eyebrow')?.remove()}main.insertAdjacentHTML('afterbegin','<header class="unified-header"><span class="page-symbol">'+p.icon+'</span><h1>'+esc(p.title)+'</h1><button class="icon-btn" data-context-settings aria-label="'+esc(p.title)+' settings">'+cog()+'</button></header>');main.style.setProperty('--feed-header-height','76px');document.body.classList.toggle('experience-compact',!!experiencePreferences[state.page]?.compact)};
document.addEventListener('click',e=>{if(e.target.closest('[data-context-settings]'))contextSettings();if(e.target.closest('[data-item-back]')&&locationStack.length){e.preventDefault();e.stopImmediatePropagation();returnToLocation()}},true);
document.addEventListener('change',e=>{if(e.target.id==='type-default-priority'){const type=currentItem().type;typePreferences[type]={...typePreferences[type],priority:e.target.value};localStorage.setItem('notomu-type-settings',JSON.stringify(typePreferences))}if(e.target.id==='experience-ideas')state.showIdeas=e.target.checked;if(e.target.id==='experience-task-view')state.taskFilter=e.target.value;if(e.target.id==='experience-compact'){experiencePreferences[state.page]={compact:e.target.checked};localStorage.setItem('notomu-experience-settings',JSON.stringify(experiencePreferences))}});
const closeBeforeContext=closeModal;closeModal=function(){closeBeforeContext();if(state.page==='calendar'||state.page==='tasks'||state.page==='studio'||state.page==='community')render()};
let edgeStart=null;
document.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];edgeStart=t.clientX<=28?{x:t.clientX,y:t.clientY}:null},{passive:true});
document.addEventListener('touchend',e=>{if(!edgeStart)return;const t=e.changedTouches[0],dx=t.clientX-edgeStart.x,dy=t.clientY-edgeStart.y;if(dx>75&&dx>Math.abs(dy)*1.7){if($('#modal').open)closeModal();else returnToLocation()}edgeStart=null},{passive:true});
document.addEventListener('touchcancel',()=>edgeStart=null,{passive:true});

const layoutElementNames={type:'Item type',title:'Title',body:'Body',...propertyNames};
function layoutForType(type){const available=['type','title',...relevantProperties({type}),'body'];const saved=typePreferences[type]?.layout||[];const list=saved.filter(x=>available.includes(x.key)).map(x=>({...x}));available.forEach(key=>{if(!list.some(x=>x.key===key))list.push({key,visible:true})});return list}
function saveTypeLayout(type,layout){typePreferences[type]={...typePreferences[type],layout};localStorage.setItem('notomu-type-settings',JSON.stringify(typePreferences))}
const itemPageBeforeStack=itemPage;
itemPage=function(){const html=itemPageBeforeStack();const c=currentItem();if(!c)return html;const wrapper=document.createElement('div');wrapper.innerHTML=html;const doc=wrapper.querySelector('.document-item');if(!doc)return html;const elements=new Map([['type',doc.querySelector('.item-type-line')],['title',doc.querySelector('#item-title')],['body',doc.querySelector('#item-body')]]);doc.querySelectorAll('.item-property-row').forEach(row=>elements.set(row.querySelector('label').getAttribute('for').replace('prop-',''),row));doc.innerHTML='';layoutForType(c.type).filter(x=>x.visible).forEach(x=>{const el=elements.get(x.key);if(el){el.dataset.stackElement=x.key;el.classList.add('stack-element');if(x.key==='body'){const section=document.createElement('section');section.className='stack-body';section.dataset.stackElement='body';section.appendChild(el);doc.appendChild(section)}else doc.appendChild(el)}});return wrapper.innerHTML};
function drawTypeLayout(){const type=currentItem().type,layout=layoutForType(type);modal(type+' settings','<section class="type-layout-settings"><h3>Item page layout</h3><p class="small muted">Arrange the page from top to bottom. Every '+esc(type.toLowerCase())+' item uses this layout.</p><div class="layout-stack">'+layout.map((entry,i)=>'<div class="layout-stack-row"><span class="layout-position">'+(i+1)+'</span><label><input type="checkbox" data-layout-visible="'+entry.key+'" '+(entry.visible?'checked':'')+'>'+esc(layoutElementNames[entry.key])+'</label><button class="icon-btn" data-layout-move="'+entry.key+'" data-layout-direction="-1" aria-label="Move '+esc(layoutElementNames[entry.key])+' up" '+(i===0?'disabled':'')+'>↑</button><button class="icon-btn" data-layout-move="'+entry.key+'" data-layout-direction="1" aria-label="Move '+esc(layoutElementNames[entry.key])+' down" '+(i===layout.length-1?'disabled':'')+'>↓</button></div>').join('')+'</div><button class="text-btn" data-layout-reset>Reset layout</button></section><label class="form-field"><span>Default priority for new items</span><select id="type-default-priority">'+['Normal','High','Low'].map(v=>'<option '+((typePreferences[type]?.priority||'Normal')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><div class="dialog-footer"><button class="btn dark" data-layout-done>Done</button></div>')}
const contextBeforeStack=contextSettings;
contextSettings=function(){if(state.page==='item')drawTypeLayout();else contextBeforeStack()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.layoutMove){const type=currentItem().type,layout=layoutForType(type),from=layout.findIndex(x=>x.key===d.layoutMove),to=from+Number(d.layoutDirection);if(to>=0&&to<layout.length){[layout[from],layout[to]]=[layout[to],layout[from]];saveTypeLayout(type,layout);drawTypeLayout()}}if('layoutReset'in d){const type=currentItem().type;delete typePreferences[type].layout;localStorage.setItem('notomu-type-settings',JSON.stringify(typePreferences));drawTypeLayout()}if('layoutDone'in d){closeModal();render()}},true);
document.addEventListener('change',e=>{if(e.target.dataset.layoutVisible){const type=currentItem().type,layout=layoutForType(type);layout.find(x=>x.key===e.target.dataset.layoutVisible).visible=e.target.checked;saveTypeLayout(type,layout)}});
const closeBeforeStack=closeModal;closeModal=function(){closeBeforeStack();if(state.page==='item')render()};
render();syncDrawer();

</script></body></html>
